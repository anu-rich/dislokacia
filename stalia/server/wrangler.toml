# Stalia on Cloudflare Workers: the site, the calculator, the document reader and the company spaces on one address.
#
#   node ../tools/build-site.js                   (puts the site into ./public; run again after every change of the site)
#   npx wrangler d1 create stalia                 (once: prints a database_id; put it below and remove the four "#")
#   npx wrangler secret put ANTHROPIC_API_KEY     (once: paste the key when asked; only reading documents needs it)
#   npx wrangler deploy
name = "stalia"
main = "worker.js"
compatibility_date = "2026-10-01"

# The built site. Pages and files come straight from here; only /api reaches the Worker's code.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api", "/api/*"]

# The company spaces. Without this block the spaces are switched off and everything else works.
# [[d1_databases]]
# binding = "DB"
# database_name = "stalia"
# database_id = ""

[vars]
# The address of your site, e.g. "https://stalia.example". Empty = any site may call the server.
ALLOWED_ORIGINS = ""
# Which Claude model reads the documents: with a Pro licence, and for free readings (Haiku costs about twenty times less).
STALIA_MODEL = "claude-sonnet-5-5"
STALIA_MODEL_FREE = "claude-haiku-5-5"
# How thoroughly the model works: low | medium | high | xhigh | max.
STALIA_EFFORT = "high"
# Readings a day for one visitor without a licence ("0" makes reading a Pro-only feature).
FREE_PER_DAY = "2"
# Readings a calendar month for one Pro licence. There are no other limits: cap your spending in the Anthropic console.
PRO_PER_MONTH = "200"
# A new company space works in full for this many days, then needs a Pro licence (it stays readable without one).
SPACE_TRIAL_DAYS = "14"

# Recommended: counters that all copies of the Worker share.
#   npx wrangler kv namespace create LIMITS      -> prints an id; put it below and remove the three "#"
# [[kv_namespaces]]
# binding = "LIMITS"
# id = ""
